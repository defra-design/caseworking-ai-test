{# Case context strip (same lg-div strip as the Grasslands case pages). Needs c, profile, caseStatus. #}
<div class="lg-div">
  <div class="govuk-width-container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <nav class="govuk-breadcrumbs govuk-!-margin-top-3" aria-label="Breadcrumb">
          <ol class="govuk-breadcrumbs__list">
            <li class="govuk-breadcrumbs__list-item"><a class="govuk-breadcrumbs__link" href="/WaterManagementV3/caselist?tab=dedupe">Cleaning the list</a></li>
            <li class="govuk-breadcrumbs__list-item"><a class="govuk-breadcrumbs__link" href="/WaterManagementV3/issue?sbi={{ c.sbi }}">Issue {{ c.sbi }}</a></li>
            <li class="govuk-breadcrumbs__list-item" aria-current="page">{{ c.id }}</li>
          </ol>
        </nav>
        <h2 class="govuk-heading-m">{{ profile.name }}</h2>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div><p><strong class="govuk-!-margin-right-1">Scheme :</strong> Water management</p></div>
      <div><p><strong class="govuk-!-margin-right-1">Application ID:</strong>{{ c.id }}</p></div>
      <div><p><strong class="govuk-!-margin-right-1">SBI: </strong>{{ c.sbi }}</p></div>
      <div><p><strong class="govuk-!-margin-right-1">Status:</strong>{{ caseStatus }}</p></div>
    </div>
  </div>
</div>
