{# Fills _budget-summary.html from the modelling settings saved on Model the list. Used by the start page and
   Clean the list; Model the list fills the same cards from its own script. Needs view.tiers and view.defaultBudget. #}
<script>
(function () {
  var tiers = {{ view.tiers | dump | safe }};
  var DEFAULT_BUDGET = {{ view.defaultBudget }};
  function $(id) { return document.getElementById(id); }
  function gbp(n) { return '\u00a3' + Math.round(n).toLocaleString('en-GB'); }
  function parse(v) { var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); return isNaN(n) ? 0 : n; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function against(v) { return v > budget ? gbp(v - budget) + ' over budget' : gbp(budget - v) + ' under budget'; }
  function get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  var budget = DEFAULT_BUDGET, attrition = 0, pass = null;
  var sb = get('waterV12TotalBudget'); if (sb && /[0-9]/.test(sb)) budget = parse(sb);
  var sp = get('waterV12PassScore');
  if (sp && /[0-9]/.test(sp)) pass = parse(sp);
  else { var sa = get('waterV12Attrition'); if (sa && /[0-9]/.test(sa)) attrition = Math.min(100, parse(sa)); }

  var cc = [];
  tiers.reduce(function (n, t, i) { n += t.count; cc[i] = n; return n; }, 0);
  var total = cc.length ? cc[cc.length - 1] : 0;
  // Same budget line as Model the list: whole score groups, never fewer than the budget fits, never more than 100% extra.
  var k0 = 0;
  while (k0 < tiers.length && tiers[k0].cumulative <= budget) k0++;
  var base = k0 ? cc[k0 - 1] : 0, k = k0;
  if (base && pass !== null) {
    var idx = -1;
    tiers.forEach(function (t, n) { if (t.score >= pass) idx = n; });
    k = Math.max(k0, idx + 1);
  } else if (attrition && base) {
    var target = base * (1 + attrition / 100), best = k0, bestDiff = Math.abs(base - target);
    for (var t = k0; t < tiers.length; t++) {
      var diff = Math.abs(cc[t] - target);
      if (diff <= bestDiff) { best = t + 1; bestDiff = diff; }
      if (cc[t] > target) break;
    }
    k = best;
  }
  while (k > k0 && base && (cc[k - 1] / base - 1) * 100 > 100) k--;
  var funded = k ? cc[k - 1] : 0;
  var impl = base ? Math.round((funded / base - 1) * 100) : 0;
  var spent = k ? tiers[k - 1].cumulative : 0;
  var unspent = budget - spent;
  var next = tiers[k];

  $('statFunded').textContent = funded;
  var notFunded = total - funded;
  $('statFundedNote').textContent = plural(notFunded, 'application') + ' not funded (' + gbp((tiers.length ? tiers[tiers.length - 1].cumulative : 0) - spent) + ')';
  $('statMinScore').textContent = k ? tiers[k - 1].score + '%' : 'None';
  $('statMinScoreNote').textContent = k ? plural(tiers[k - 1].count, 'case') + ' at this score' : 'None fit the budget';
  $('statUnspentLabel').textContent = 'Current cohort value';
  $('statUnspent').textContent = gbp(spent);
  $('statUnspentNote').textContent = against(spent);
  if (next) {
    $('statNextLabel').textContent = 'Cohort value at ' + next.score + '%';
    $('statNext').textContent = gbp(next.cumulative);
    $('statNextNote').textContent = against(next.cumulative);
  } else {
    $('statNextLabel').textContent = 'Next cohort value';
    $('statNext').textContent = 'n/a';
    $('statNextNote').textContent = 'All scores funded';
  }
  var over = budget > 0 && spent > budget;
  var pct = budget > 0 ? (over ? budget / spent * 100 : spent / budget * 100) : 0;
  $('barAllocated').style.width = pct + '%';
  $('barAllocated').textContent = over ? '100%' : (pct >= 8 ? Math.round(pct) + '%' : '');
  $('barUnspent').className = over ? 'app-budget-bar__over' : 'app-budget-bar__free';
  $('barUnspent').textContent = over ? (100 - pct >= 8 ? '+' + Math.round((spent - budget) / budget * 100) + '%' : '') : ((100 - pct) >= 8 ? Math.round(100 - pct) + '%' : '');
  $('keyUnspentSwatch').className = 'app-budget-key__swatch ' + (over ? 'app-budget-key__swatch--over' : 'app-budget-key__swatch--free');
  $('keyAllocated').textContent = gbp(spent);
  $('keyUnspentLabel').textContent = unspent < 0 ? 'Over budget\u00a0' : 'Unspent\u00a0';
  $('keyUnspent').textContent = gbp(Math.abs(unspent));
})();
</script>
