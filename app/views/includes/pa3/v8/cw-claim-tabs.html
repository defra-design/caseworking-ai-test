      </button>
      <ul class="govuk-service-navigation__list" id="navigation">

            <strong class="govuk-service-navigation__active-fallback">Tasks</strong>
          </a>
        </li> 
        <li class="govuk-service-navigation__item-c{% if claimTab == "view" %} govuk-service-navigation__item--active{% endif %}">
          <a class="govuk-service-navigation__link" href="javascript:preventDefault();">
            Claim
          </a>
        </li>
        <li class="govuk-service-navigation__item-c{% if claimTab == "documents" %} govuk-service-navigation__item--active{% endif %}">
          <a class="govuk-service-navigation__link" href="javascript:preventDefault();">
            Documents
          </a>
        </li>

      </ul>
    </nav>
  </div>
    
</div>
